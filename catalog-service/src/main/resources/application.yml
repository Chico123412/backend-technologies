spring:
  application:
    name: autoservice
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/autoservice}
    username: ${DB_USERNAME:autoservice}
    password: ${DB_PASSWORD:autoservice_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  quartz:
    scheduler-name: autoservice-scheduler
    job-store-type: jdbc
    overwrite-existing-jobs: false
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.useProperties: true

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: autoservice-web
            client-secret: autoservice-web-secret
            authorization-grant-type: authorization_code
            scope: openid, profile, email
        provider:
          keycloak:
            issuer-uri: ${app.keycloak-url}/realms/autoservice
      resourceserver:
        jwt:
          issuer-uri: ${app.keycloak-url}/realms/autoservice
          jwk-set-uri: ${app.keycloak-url}/realms/autoservice/protocol/openid-connect/certs

app:
  keycloak-url: ${KEYCLOAK_URL:http://localhost:8081}

server:
  port: 8080
