<!doctype html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Послуга</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><main class="container narrow"><header><div><p class="eyebrow">Каталог автосервісу</p><h1>Дані послуги</h1></div><a href="/services">До каталогу</a></header>
    <form class="panel form-grid" th:action="${action}" th:object="${form}" method="post">
        <label class="wide">Назва<input th:field="*{name}" required maxlength="120"><small th:errors="*{name}"></small></label>
        <label class="wide">Опис<textarea th:field="*{description}" maxlength="1000" rows="4"></textarea><small th:errors="*{description}"></small></label>
        <label>Ціна, грн<input th:field="*{price}" type="number" min="0.01" max="99999999.99" step="0.01" required><small th:errors="*{price}"></small></label>
        <label>Тривалість, хв<input th:field="*{durationMinutes}" type="number" min="1" max="1440" required><small th:errors="*{durationMinutes}"></small></label>
        <button class="button" type="submit">Зберегти</button>
    </form>
</main></body></html>
