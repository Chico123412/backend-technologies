spring:
  application:
    name: autoservice
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/autoservice}
    username: ${DB_USERNAME:autoservice}
    password: ${DB_PASSWORD:autoservice_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080
