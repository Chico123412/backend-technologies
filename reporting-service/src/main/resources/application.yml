spring:
  application:
    name: reporting-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:autoservice}
    password: ${RABBITMQ_PASSWORD:autoservice_dev}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        prefetch: 1
        default-requeue-rejected: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/autoservice}
    username: ${DB_USERNAME:autoservice}
    password: ${DB_PASSWORD:autoservice_dev}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  quartz:
    scheduler-name: autoservice-scheduler
    job-store-type: jdbc
    overwrite-existing-jobs: false
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.useProperties: true

server:
  port: 8082

catalog:
  lookup:
    transport: ${CATALOG_TRANSPORT:http}
    http-base-url: ${CATALOG_HTTP_URL:http://localhost:8080}
    grpc-target: ${CATALOG_GRPC_TARGET:localhost:9090}
    connect-timeout-ms: ${CATALOG_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${CATALOG_READ_TIMEOUT_MS:1500}
    deadline-ms: ${CATALOG_DEADLINE_MS:1500}
